services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # http -> https redirects; status page by IP
      - "443:443"     # https sites (wildcard cert in ./certs - required)
      - "9000:9000"   # status/test page (http) - remove this line to turn it off
      - "8081:8081"   # old GAT address -> redirects to https://gat.opelikaschools.org
    volumes:
      - ./certs:/certs:ro   # fullchain.pem + privkey.pem (wildcard *.opelikaschools.org)
      - ./auth:/auth:ro     # gat.htpasswd (GAT's username/password)
    # Lets nginx reach the apps' published ports on this host
    # (UPS Monitor 8084, IIQ Responder 8082) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy-net             # shared with GAT so nginx can reach it by name

networks:
  proxy-net:
    external: true            # create once: docker network create proxy-net

# Sites (each needs an internal DNS record pointing at this server):
#   https://accounts.opelikaschools.org      -> IIS 10.11.1.69
#   https://gat.opelikaschools.org           -> GAT (gat-web-1, via proxy-net), nginx password
#   https://upsmonitor.opelikaschools.org    -> UPS Monitor (host port 8084), its own login
#   https://iiqresponder.opelikaschools.org  -> IIQ Responder (host port 8082), its own login
