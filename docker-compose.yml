services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # Let's Encrypt validation + redirect to https
      - "443:443"     # https://accounts.opelikaschools.org
      - "9000:9000"   # test page (http) - remove this line to turn it off
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro

  # Renews the certificate twice a day; nginx picks up the new cert on its own.
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
