services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # status page by IP; accounts.opelikaschools.org -> https
      - "443:443"     # https://accounts.opelikaschools.org (on once a cert is in ./certs)
      - "9000:9000"   # test page (http) - remove this line to turn it off
      - "8081:8081"   # GAT, password protected (needs ./auth/gat.htpasswd)
    volumes:
      - ./certs:/certs:ro   # put fullchain.pem + privkey.pem here (see README)
      - ./auth:/auth:ro     # password files (gat.htpasswd)
    # Lets nginx reach other containers' published ports on this host as
    # host.docker.internal - used for UPS Monitor (8084, 42-ups-monitor.conf)
    # and by 40-other-apps.conf later.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy-net             # shared with GAT so nginx can reach it by name

networks:
  proxy-net:
    external: true            # create once: docker network create proxy-net

# Other apps on this server:
#   IIQResponder  http://10.1.0.145:8082  (own login)
#   GAT           http://10.1.0.145:8081  (through nginx, password above)
#   UPS Monitor   http://ups.opelikaschools.org  (through nginx)  or  http://10.1.0.145:8084
