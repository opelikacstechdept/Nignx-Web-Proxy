services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # http -> https redirects; status page by IP
      - "443:443"     # https sites (wildcard cert in ./certs - required)
      - "9000:9000"   # status/test page (http) - remove this line to turn it off
      - "8081:8081"   # old GAT address -> redirects to https://gat.opelikaschools.org
    volumes:
      - ./certs:/certs:ro   # fullchain.pem + privkey.pem (wildcard *.opelikaschools.org)
    networks:
      default:          # outbound (IIS at 10.11.1.69) and published ports
      gat:              # each app has its own network, shared only with nginx,
      ups-monitor:      # so the apps can't reach each other - only nginx can
      iiq-responder:    # reach them (at http://<network name>:8080)
      iiq-assets:

  # Keeps every compose app on this server in step with GitHub: every 15 minutes it
  # makes each app folder (a git checkout) match its repo - hand edits are put back -
  # and pulls newer images built by GitHub Actions, recreating only what changed.
  # Private repos: a read-only token in ./github-token (see README).
  updater:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/updater:latest
    container_name: updater
    restart: unless-stopped
    environment:
      INTERVAL: "900"         # seconds between checks
      SKIP_PROJECTS: ""       # compose project names to leave alone, e.g. "my-test-app"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # controls Docker (as root) - keep this host locked down
      - /opt:/opt                                    # the apps' folders, at the same path as on the server
      - ${HOME}/.docker:/root/.docker:ro             # the server's ghcr.io login (docker login ghcr.io)

# Each app's own standalone network, created once on the server (UPS Monitor's
# deploy/update.sh creates its own):
#   docker network create gat
#   docker network create ups-monitor
#   docker network create iiq-responder
#   docker network create iiq-assets
networks:
  gat:
    external: true
  ups-monitor:
    external: true
  iiq-responder:
    external: true
  iiq-assets:
    external: true

# Sites (each needs an internal DNS record pointing at this server):
#   https://accounts.opelikaschools.org      -> IIS 10.11.1.69
#   https://gat.opelikaschools.org           -> http://gat:8080            GAT's Google sign-in
#   https://upsmonitor.opelikaschools.org    -> http://ups-monitor:8080    UPS Monitor's login
#   https://iiqresponder.opelikaschools.org  -> http://iiq-responder:8080  IIQ Responder's login
#   https://iiqassets.opelikaschools.org     -> http://iiq-assets:8080     iiQ Assets' login
