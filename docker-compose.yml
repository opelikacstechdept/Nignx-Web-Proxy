services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # redirects to https
      - "443:443"     # https://accounts.opelikaschools.org (on once a cert is in ./certs)
      - "9000:9000"   # test page (http) - remove this line to turn it off
    volumes:
      - ./certs:/certs:ro   # put fullchain.pem + privkey.pem here (see README)
    # Lets nginx reach other containers' published ports on this host
    # (the apps on 8080/8081) as host.docker.internal - used by
    # nginx/conf.d/40-other-apps.conf once those apps move to names.
    extra_hosts:
      - "host.docker.internal:host-gateway"

# The other apps on this server are separate containers on 8080 and 8081.
# Today they are reached directly: http://10.1.0.145:8080 and :8081.
# Do not publish 8080/8081 here - those ports belong to the apps.
