services:
  intranet-proxy:
    image: ghcr.io/opelikacstechdept/nignx-web-proxy/intranet-proxy:latest
    container_name: intranet-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # http -> https redirects; status page by IP
      - "443:443"     # https sites (wildcard cert in ./certs - required)
      - "9000:9000"   # status/test page (http) - remove this line to turn it off
      - "8081:8081"   # old GAT address -> redirects to https://gat.opelikaschools.org
    volumes:
      - ./certs:/certs:ro   # fullchain.pem + privkey.pem (wildcard *.opelikaschools.org)
    networks:
      default:                # outbound (IIS at 10.11.1.69) and published ports
      proxy-gat:              # one private network per app: nginx is on all of them,
      proxy-upsmonitor:       # each app only on its own, so apps can't reach
      proxy-iiqresponder:     # each other - only nginx can reach them

# Create once on the server (internal = no traffic in/out except between members):
#   docker network create --internal proxy-gat
#   docker network create --internal proxy-upsmonitor
#   docker network create --internal proxy-iiqresponder
networks:
  proxy-gat:
    external: true
  proxy-upsmonitor:
    external: true
  proxy-iiqresponder:
    external: true

# Sites (each needs an internal DNS record pointing at this server):
#   https://accounts.opelikaschools.org      -> IIS 10.11.1.69
#   https://gat.opelikaschools.org           -> gat-web-1:8080     (proxy-gat), no login
#   https://upsmonitor.opelikaschools.org    -> upsmonitor:8080    (proxy-upsmonitor), its own login
#   https://iiqresponder.opelikaschools.org  -> iiqresponder:8080  (proxy-iiqresponder), its own login
