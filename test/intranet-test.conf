# TEST proxy: https://<proxy-server>:9000  ->  https://10.11.1.69:443 (IIS)
# Runs in its own container next to production; uses a self-signed cert.

upstream iis_backend_test {
    server 10.11.1.69:443;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 9000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/test.crt;
    ssl_certificate_key /etc/nginx/certs/test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Someone typed http:// on port 9000 -> send them to https://
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 100m;
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass https://iis_backend_test;
        proxy_ssl_server_name on;
        proxy_ssl_name        accounts.opelikaschools.org;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Always present the real site name to IIS, even if browsing by IP
        proxy_set_header Host              accounts.opelikaschools.org;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Keep IIS redirects on the test port instead of jumping to :443
        proxy_redirect https://accounts.opelikaschools.org/ /;
        proxy_redirect http://accounts.opelikaschools.org/  /;

        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
        proxy_read_timeout 300s;
    }
}
