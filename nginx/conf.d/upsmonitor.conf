# https://upsmonitor.opelikaschools.org -> UPS Monitor, over its own network "ups-monitor"
# (http://ups-monitor:8080). Login is the app's own.

server {
    listen 443 ssl;
    server_name upsmonitor.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location / {
        set $app http://ups-monitor:8080;   # looked up when used, so nginx starts even if the app is down
        proxy_pass $app;
    }
}
