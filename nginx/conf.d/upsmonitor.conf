# https://upsmonitor.opelikaschools.org -> UPS Monitor, over its own network "ups-monitor"
# (http://ups-monitor:8080). Login: Entra ID, enforced here by oauth2-proxy
# (container "oauth2-proxy-upsmonitor:4180") before any request reaches the app.
# The app's own username/password login is left in place as a fallback behind this.

server {
    listen 443 ssl;
    server_name upsmonitor.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    # oauth2-proxy's own endpoints (sign-in page, callback, sign-out, static assets)
    location /oauth2/ {
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;   # looked up when used, like $app below
        proxy_pass       $oauth2_proxy;
        proxy_set_header Host                   $host;
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Scheme               $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Internal subrequest nginx uses to ask "is this visitor signed in?"
    location = /oauth2/auth {
        internal;
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host             $host;
        proxy_set_header  X-Real-IP        $remote_addr;
        proxy_set_header  X-Scheme         $scheme;
        proxy_set_header  Content-Length   "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        # Pass who signed in through to the app, in case it wants to show/log it
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        set $app http://ups-monitor:8080;   # looked up when used, so nginx starts even if the app is down
        proxy_pass $app;
    }
}
