# https://upsmonitor.opelikaschools.org -> UPS Monitor (host port 8084). Login is the app's own.

server {
    listen 443 ssl;
    server_name upsmonitor.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location / {
        proxy_pass http://host.docker.internal:8084;
    }
}
