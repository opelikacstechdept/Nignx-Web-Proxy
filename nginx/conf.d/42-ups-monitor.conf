# UPS Monitor (opelikacstechdept/UPS-Monitor) by name, through nginx.
#
#   http://ups.opelikaschools.org  ->  UPS Monitor container on this host, port 8084
#
# - The app is still reachable directly at http://10.1.0.145:8084 as before.
# - Needs an internal DNS record: ups.opelikaschools.org -> 10.1.0.145.
#   To use a different name, change server_name below (and the DNS record).
# - UPS Monitor has its own login (HTTP basic auth, APP_USERNAME/APP_PASSWORD
#   in its .env). nginx passes it straight through - no extra password here.
# - nginx reaches the app via host.docker.internal (extra_hosts in
#   docker-compose.yml), i.e. the 8084 port UPS Monitor publishes on the host.
# - Only the web dashboard goes through nginx. Syslog from the UPS cards
#   (UDP 514) still goes straight to the UPS Monitor container.

upstream ups_monitor_backend {
    server host.docker.internal:8084;   # UPS Monitor's published port on this host
    keepalive 8;
}

server {
    listen 80;
    server_name ups.opelikaschools.org;              # <-- change the name here
    access_log /var/log/nginx/access.log no_query;

    location / {
        proxy_pass http://ups_monitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;       # websockets
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
}
