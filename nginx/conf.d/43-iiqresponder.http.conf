# IIQ Responder over plain http - only used while there is NO certificate
# (fallback for 43-iiqresponder.https.conf): http://iiqresponder.opelikaschools.org

upstream iiq_responder_backend {
    server host.docker.internal:8082;
    keepalive 8;
}

server {
    listen 80;
    server_name iiqresponder.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    client_max_body_size 100m;

    location / {
        proxy_pass http://iiq_responder_backend;
        include /etc/nginx/snippets/proxy-app.conf;
    }
}
