# GAT - https://gat.opelikaschools.org (password protected), when the wildcard
# certificate is present. The http fallback is 41-gat.http.conf.
# Needs /auth/gat.htpasswd (else off), and GAT on the shared "proxy-net" network.

server {
    listen 443 ssl;
    http2 on;
    server_name gat.opelikaschools.org;
    include /etc/nginx/snippets/ssl.conf;
    access_log /var/log/nginx/access.log no_query;

    auth_basic           "GAT - sign in";
    auth_basic_user_file /auth/gat.htpasswd;
    client_max_body_size 100m;

    # Look GAT up at request time (Docker DNS), so nginx still starts if it's stopped
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gat_backend http://gat-web-1:8080;

    location / {
        proxy_pass $gat_backend;
        include /etc/nginx/snippets/proxy-app.conf;
        proxy_set_header Authorization "";   # don't pass the nginx login on to GAT
    }
}

# http://gat.opelikaschools.org and the old http://10.1.0.145:8081 -> https
server {
    listen 80;
    listen 8081;
    server_name gat.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    return 301 https://gat.opelikaschools.org$request_uri;
}
