# Shared settings used by every site in this image.
# --- Change the IIS server address in the upstream block below ---

upstream iis_backend {
    server 10.11.1.69:443;    # IIS server (HTTPS)
    keepalive 16;
}

# Supports WebSockets (e.g. SignalR) while keeping normal keepalive connections
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Access log WITHOUT query strings. Sign-in callbacks can carry authorization
# codes / tokens in the URL; they should never be written to log files.
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';
