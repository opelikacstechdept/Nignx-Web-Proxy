# Status/test page served by nginx itself (no certificate, plain HTTP), on:
#   - port 9000 (any address), and
#   - port 80 for anything that isn't a known site name (e.g. http://10.1.0.145).
# Confirms the proxy server is up and can reach IIS. Not a copy of the site:
# Microsoft sign-in only returns to https://accounts.opelikaschools.org, so the
# real site must be tested on 443.

server {
    listen 9000;
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/test;
    access_log /var/log/nginx/access.log no_query;

    location = / {
        ssi on;                       # fills in client IP, time, etc.
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /status.json {
        add_header Cache-Control "no-store";
    }

    # Button on the test page: can nginx reach IIS? (GET only, root page only)
    location = /backend-check {
        limit_except GET { deny all; }
        proxy_pass https://iis_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name        accounts.opelikaschools.org;
        proxy_set_header Host accounts.opelikaschools.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        add_header Cache-Control "no-store";
    }
}
