# Port 80: Let's Encrypt validation + redirect everything else to HTTPS.
# Always on (needed to obtain the first certificate).

server {
    listen 80 default_server;
    server_name accounts.opelikaschools.org _;
    access_log /var/log/nginx/access.log no_query;

    # certbot (webroot mode) writes challenge files here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://accounts.opelikaschools.org$request_uri;
    }
}
