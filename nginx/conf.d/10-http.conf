# Port 80: only requests for accounts.opelikaschools.org are sent to HTTPS.
# Anything else on port 80 (e.g. browsing by IP, http://10.1.0.145) gets the
# proxy status page instead - see 30-test-9000.conf (default_server).

server {
    listen 80;
    server_name accounts.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location / {
        return 301 https://$host$request_uri;
    }
}
