# https://gat.opelikaschools.org -> GAT, over the proxy-net network (container gat-web-1, app port 8080)
# Login: nginx username/password, users in /opt/nginx-proxy/auth/gat.htpasswd

server {
    listen 443 ssl;
    server_name gat.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    auth_basic           "GAT - sign in";
    auth_basic_user_file /auth/gat.htpasswd;

    location / {
        set $gat http://gat-web-1:8080;   # looked up when used, so nginx starts even if GAT is down
        proxy_pass $gat;
    }
}

# Old address http://10.1.0.145:8081 -> https
server {
    listen 8081;
    return 301 https://gat.opelikaschools.org$request_uri;
}
