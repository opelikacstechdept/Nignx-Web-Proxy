# https://iiqassets.opelikaschools.org -> iiQ Assets, over its own network "iiq-assets"
# (http://iiq-assets:8080). Login: Entra ID, enforced here by oauth2-proxy
# (container "oauth2-proxy-iiq:4180", shared with iiqresponder.conf). The app's own
# username/password login is left in place as a fallback behind this.

server {
    listen 443 ssl;
    server_name iiqassets.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location /oauth2/ {
        set $oauth2_proxy http://oauth2-proxy-iiq:4180;   # looked up when used, like $app below
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        set $oauth2_proxy http://oauth2-proxy-iiq:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  Content-Length     "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        set $app http://iiq-assets:8080;   # looked up when used, so nginx starts even if the app is down
        proxy_pass $app;
    }
}
