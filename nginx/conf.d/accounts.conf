# https://accounts.opelikaschools.org -> IIS server (Microsoft sign-in is the site's own)

upstream iis_backend {
    server 10.11.1.69:443;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name accounts.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    large_client_header_buffers 4 32k;   # large sign-in cookies

    location / {
        proxy_pass https://iis_backend;
        # IIS serves https: send the real name (SNI) so IIS picks the right site
        proxy_ssl_server_name on;
        proxy_ssl_name        accounts.opelikaschools.org;
        # Leave Microsoft sign-in redirects exactly as IIS sends them
        proxy_redirect off;
    }
}
