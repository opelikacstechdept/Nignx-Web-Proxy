# https://iiqresponder.opelikaschools.org -> IIQ Responder (host port 8082). Login is the app's own.

server {
    listen 443 ssl;
    server_name iiqresponder.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location / {
        proxy_pass http://host.docker.internal:8082;
    }
}
