# https://iiqresponder.opelikaschools.org -> IIQ Responder, over its own network "iiq-responder"
# (http://iiq-responder:8080). Login is the app's own.

server {
    listen 443 ssl;
    server_name iiqresponder.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location / {
        set $app http://iiq-responder:8080;   # looked up when used, so nginx starts even if the app is down
        proxy_pass $app;
    }
}
