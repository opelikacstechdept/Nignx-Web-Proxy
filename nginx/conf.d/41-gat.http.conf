# GAT over plain http - only used while there is NO certificate (fallback for
# 41-gat.https.conf): http://gat.opelikaschools.org and http://10.1.0.145:8081.
# Needs /auth/gat.htpasswd (else off).

server {
    listen 80;
    listen 8081;
    server_name gat.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    auth_basic           "GAT - sign in";
    auth_basic_user_file /auth/gat.htpasswd;
    client_max_body_size 100m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gat_backend http://gat-web-1:8080;

    location / {
        proxy_pass $gat_backend;
        include /etc/nginx/snippets/proxy-app.conf;
        proxy_set_header Authorization "";
    }
}
