# https://ocs-8600-7x05-78k1.opelikaschools.org -> CO-HYPERV-SVR2's BMC (Lenovo
# XClarity/IMM), direct to its IP (10.11.1.74), which only presents a self-signed
# certificate - proxy_ssl_verify is off for that reason. Login: Entra ID, enforced
# here by oauth2-proxy (container "oauth2-proxy-upsmonitor:4180", shared with
# upsmonitor/gat/devices), then the BMC's own login as a second factor behind it.
#
# Hostname is intentionally obfuscated (location code-model code-serial tail,
# see the dns-name-obfuscation convention) rather than descriptive - the old
# descriptive hostname co-hyperv-svr2-bmc.opelikaschools.org was retired on
# purpose, don't re-add it as an alias.
#
# Caveat: KVM/virtual-console/virtual-media redirection on this BMC may open
# secondary connections straight to 10.11.1.74 on other ports, bypassing this
# proxy - basic management pages work fine here, full remote-console use may
# still need to be on the same network as the device.

server {
    listen 443 ssl;
    server_name ocs-8600-7x05-78k1.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location /oauth2/ {
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  Content-Length     "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        # Setting any proxy_set_header here drops ALL of 00-common.conf's inherited
        # ones (nginx doesn't merge across levels) - so the common headers are
        # re-declared alongside the auth ones, not just X-Forwarded-User/-Email.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        set $app https://10.11.1.74;   # looked up when used, so nginx starts even if the device is down
        proxy_ssl_verify off;          # the BMC presents a self-signed certificate
        proxy_pass $app;
    }
}
