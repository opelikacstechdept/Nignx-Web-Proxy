# IIQ Responder - https://iiqresponder.opelikaschools.org, when the wildcard certificate is present.
# The http fallback is 43-iiqresponder.http.conf.
# App: opelikacstechdept/IIQ-Responder - its container publishes port 8082 on this host; nginx reaches it via
# host.docker.internal (extra_hosts in docker-compose.yml; site is off without it).
# The app's own login (HTTP basic auth) passes straight through.

upstream iiq_responder_backend {
    server host.docker.internal:8082;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name iiqresponder.opelikaschools.org;
    include /etc/nginx/snippets/ssl.conf;
    access_log /var/log/nginx/access.log no_query;
    client_max_body_size 100m;

    location / {
        proxy_pass http://iiq_responder_backend;
        include /etc/nginx/snippets/proxy-app.conf;
    }
}

server {
    listen 80;
    server_name iiqresponder.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    return 301 https://iiqresponder.opelikaschools.org$request_uri;
}
