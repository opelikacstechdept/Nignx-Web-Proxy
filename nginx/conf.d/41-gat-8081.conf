# GAT (gat-web-1) behind a password, on port 8081.
#
#   http://10.1.0.145:8081  -> browser asks for a username/password -> GAT
#
# - The password file is /opt/nginx-proxy/auth/gat.htpasswd on the server
#   (mounted at /auth). This site is only switched on when that file exists
#   (see /docker-entrypoint.d/05-cert-watch.sh); password changes apply at once.
# - nginx reaches GAT by container name over the shared Docker network
#   "proxy-net"; GAT itself no longer publishes a port, so the password can't
#   be bypassed.
# - Plain http: the password crosses the network unencrypted (base64). Move this
#   to https once a certificate covering the name/IP is in place.

server {
    listen 8081;
    server_name _;
    access_log /var/log/nginx/access.log no_query;

    auth_basic           "GAT - sign in";
    auth_basic_user_file /auth/gat.htpasswd;

    client_max_body_size 100m;

    # Docker's internal DNS: look GAT up at request time, so nginx still starts
    # (and other sites keep working) if the GAT container is stopped.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gat_backend http://gat-web-1:8080;

    location / {
        proxy_pass $gat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Authorization     "";   # don't pass the nginx login on to GAT
        proxy_read_timeout 300s;
    }
}
