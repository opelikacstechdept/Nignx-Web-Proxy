# Other apps on this Docker host - reach them by NAME through nginx.
#
# RIGHT NOW: everything below is commented out. The two apps are reached
# directly on their own ports, without nginx:
#     http://10.1.0.145:8080   (app 1)
#     http://10.1.0.145:8081   (app 2)
#
# TO SWITCH TO NAMES LATER (example names - change to the real ones):
#   1. Internal DNS: point app1.opelikaschools.org and app2.opelikaschools.org
#      at 10.1.0.145 (A records).
#   2. Uncomment the blocks below (remove the leading "# " on each line;
#      lines starting with "##" stay as they are) and
#      change the server_name lines to the real names.
#   3. Commit and push to main -> GitHub builds the image. On the server:
#        docker compose pull && docker compose up -d
#   4. Browse to http://app1.opelikaschools.org and http://app2.opelikaschools.org.
#   5. When the names work, optionally stop publishing 8080/8081 to the
#      network (in the apps' own compose files) so they're only reachable
#      through nginx.
#
# HOW nginx REACHES THE APPS: "host.docker.internal" is the Docker host itself
# (set up by extra_hosts in docker-compose.yml), so nginx connects to the same
# 8080/8081 ports you use today.
#
# HTTPS LATER: once you have a certificate covering these names (e.g. a
# wildcard *.opelikaschools.org), copy the 443 pattern from
# 20-accounts-443.conf: add "listen 443 ssl;" plus the two ssl_certificate
# lines, and make port 80 redirect to https.
#
# Names not listed here still fall through to port 80's default
# (10-http.conf), which redirects to accounts.opelikaschools.org.

