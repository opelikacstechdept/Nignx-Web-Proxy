# Status/test page, plain http: http://10.1.0.145 (or any unknown name) and :9000

server {
    listen 80 default_server;
    listen 9000;
    root /usr/share/nginx/test;
    access_log /var/log/nginx/access.log no_query;
    add_header Cache-Control "no-store";

    location = / {
        ssi on;   # fills in client IP, time, etc.
        try_files /index.html =404;
    }

    location = /status.json { }

    # "Test connection to IIS" button (GET only)
    location = /backend-check {
        limit_except GET { deny all; }
        proxy_pass https://iis_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name        accounts.opelikaschools.org;
        proxy_set_header Host accounts.opelikaschools.org;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
