# Production: https://accounts.opelikaschools.org on 443 -> IIS.
# Switched on automatically once a certificate is in /certs
# (see /docker-entrypoint.d/05-cert-watch.sh).

server {
    listen 443 ssl;
    http2 on;
    server_name accounts.opelikaschools.org;

    # Links to /certs/fullchain.pem + privkey.pem,
    # set up at startup by /docker-entrypoint.d/05-cert-watch.sh
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log no_query;   # never log tokens/codes in URLs

    client_max_body_size 100m;          # max upload size
    large_client_header_buffers 4 32k;  # sign-in cookies / Kerberos headers can be large

    location / {
        proxy_pass https://iis_backend;

        # IIS serves HTTPS on 443: send the public hostname as SNI so IIS
        # picks the accounts.opelikaschools.org binding/certificate.
        proxy_ssl_server_name on;
        proxy_ssl_name        accounts.opelikaschools.org;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # --- Microsoft (Entra ID) sign-in ---
        # The app builds its redirect_uri from what it receives. IIS gets the real
        # hostname, HTTPS and port 443, so the redirect_uri stays
        # https://accounts.opelikaschools.org/... and matches the app registration.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Pass redirects to login.microsoftonline.com (and back) untouched.
        proxy_redirect off;
        # Set-Cookie headers (nonce/correlation/auth cookies, SameSite=None; Secure)
        # are passed through unmodified - do not add proxy_cookie_* rewrites.

        # Auth cookies can be large (chunked .AspNetCore.Cookies / FedAuth).
        # Too-small buffers cause "502 upstream sent too big header" after login.
        proxy_buffer_size       64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size 128k;

        proxy_read_timeout 300s;
    }
}
