# https://devices.opelikaschools.org -> Device Management Portal landing page,
# over its own network "device-portal" (http://device-portal:80). Login: Entra ID,
# enforced here by oauth2-proxy (container "oauth2-proxy-upsmonitor:4180", shared
# with upsmonitor/gat - no fixed OAUTH2_PROXY_REDIRECT_URL, it builds the callback
# per-request from Host/X-Forwarded-Proto). No separate login behind this gate -
# it's a static page.

server {
    listen 443 ssl;
    server_name devices.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;

    location /oauth2/ {
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        set $oauth2_proxy http://oauth2-proxy-upsmonitor:4180;
        proxy_pass        $oauth2_proxy;
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Forwarded-Host   $host;
        proxy_set_header  Content-Length     "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        # Setting any proxy_set_header here drops ALL of 00-common.conf's inherited
        # ones (nginx doesn't merge across levels) - so the common headers are
        # re-declared alongside the auth ones, not just X-Forwarded-User/-Email.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        set $app http://device-portal:80;   # looked up when used, so nginx starts even if the app is down
        proxy_pass $app;
    }
}
