# Settings shared by every site. Each site has its own file in this folder.

# --- HTTPS: one wildcard certificate (*.opelikaschools.org) for all sites ----
# The files are /opt/nginx-proxy/certs/{fullchain,privkey}.pem on the server.
ssl_certificate     /certs/fullchain.pem;
ssl_certificate_key /certs/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
http2 on;
add_header Strict-Transport-Security "max-age=31536000" always;

# --- Proxy settings (a location that sets its own proxy_set_header loses these)
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;        # websockets
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Authorization     $upstream_authorization;
proxy_buffer_size       64k;      # large sign-in cookies
proxy_buffers           8 64k;
proxy_busy_buffers_size 128k;
proxy_connect_timeout   10s;      # fail fast if an app is down
proxy_read_timeout      300s;
client_max_body_size    100m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# GAT's login is checked by nginx, so don't pass that password on to GAT.
# Every other site checks its own login, so its Authorization header passes through.
map $host $upstream_authorization {
    gat.opelikaschools.org  "";
    default                 $http_authorization;
}

# Docker's DNS: apps are reached by name over the shared proxy-net network
resolver 127.0.0.11 valid=30s ipv6=off;

# Access log without query strings: sign-in callbacks can carry codes/tokens.
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';

# --- http -> https for every opelikaschools.org name ---------------------------
server {
    listen 80;
    server_name *.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    return 301 https://$host$request_uri;
}

# --- https catch-all: refuse names that aren't one of the sites ----------------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
