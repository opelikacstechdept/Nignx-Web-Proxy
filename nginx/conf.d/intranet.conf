# --- Change the IIS server address in the upstream block below ---

upstream iis_backend {
    server 192.168.1.50:80;   # IIS server IP or hostname, and port
    keepalive 16;
}

# Supports WebSockets (e.g. SignalR) while keeping normal keepalive connections
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name accounts.opelikaschools.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name accounts.opelikaschools.org;

    ssl_certificate     /etc/letsencrypt/live/accounts.opelikaschools.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.opelikaschools.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100m;          # max upload size
    large_client_header_buffers 4 32k;  # Kerberos auth headers can be large

    location / {
        proxy_pass http://iis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
        proxy_read_timeout 300s;
    }
}
