# UPS Monitor - https://upsmonitor.opelikaschools.org, when the wildcard certificate is present.
# The http fallback is 42-upsmonitor.http.conf.
# App: opelikacstechdept/UPS-Monitor - its container publishes port 8084 on this host; nginx reaches it via
# host.docker.internal (extra_hosts in docker-compose.yml; site is off without it).
# The app's own login (HTTP basic auth) passes straight through.

upstream ups_monitor_backend {
    server host.docker.internal:8084;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name upsmonitor.opelikaschools.org;
    include /etc/nginx/snippets/ssl.conf;
    access_log /var/log/nginx/access.log no_query;
    client_max_body_size 100m;

    location / {
        proxy_pass http://ups_monitor_backend;
        include /etc/nginx/snippets/proxy-app.conf;
    }
}

server {
    listen 80;
    server_name upsmonitor.opelikaschools.org;
    access_log /var/log/nginx/access.log no_query;
    return 301 https://upsmonitor.opelikaschools.org$request_uri;
}
