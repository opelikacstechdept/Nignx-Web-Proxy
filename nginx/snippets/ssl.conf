# HTTPS settings shared by every https site. The certificate is the wildcard
# *.opelikaschools.org in /opt/nginx-proxy/certs on the server, linked into
# /etc/nginx/ssl at startup by /docker-entrypoint.d/05-cert-watch.sh.
ssl_certificate     /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

add_header Strict-Transport-Security "max-age=31536000" always;
