name: Build intranet proxy image

on:
  push:            # every push to any branch builds and tests the image
  schedule:
    - cron: "0 6 * * 1"   # Weekly rebuild to pick up nginx base image security patches
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/intranet-proxy
  UPDATER_IMAGE: ghcr.io/${{ github.repository }}/updater

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          load: true
          pull: true          # always fetch the newest base image (needed for the weekly patch rebuild)
          tags: intranet-proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Validate the nginx config with a throwaway self-signed cert,
      # so a broken config never reaches the registry
      - name: Test nginx config
        run: |
          # Throwaway wildcard cert, mounted like on the server
          mkdir -p test-certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=*.opelikaschools.org" \
            -keyout test-certs/privkey.pem -out test-certs/fullchain.pem
          docker run --rm \
            -v "$PWD/test-certs:/certs:ro" intranet-proxy:test nginx -t

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # The updater (keeps every compose app on the server up to date)
      - name: Check updater script
        run: sh -n updater/update-apps.sh

      - name: Updater tags
        id: meta-updater
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UPDATER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Push updater image
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          pull: true
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
