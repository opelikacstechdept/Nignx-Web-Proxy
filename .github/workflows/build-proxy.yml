name: Build intranet proxy image

on:
  push:
    branches: [main]
    paths:
      - "nginx/**"
      - ".github/workflows/build-proxy.yml"
  schedule:
    - cron: "0 6 * * 1"   # Weekly rebuild to pick up nginx base image security patches
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/intranet-proxy
  DOMAIN: accounts.opelikaschools.org   # must match server_name / cert paths in intranet.conf

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          load: true
          pull: true          # always fetch the newest base image (needed for the weekly patch rebuild)
          tags: intranet-proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Validate the nginx config with a throwaway self-signed cert,
      # so a broken config never reaches the registry
      - name: Test nginx config
        run: |
          mkdir -p test-certs/live/$DOMAIN
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$DOMAIN" \
            -keyout test-certs/live/$DOMAIN/privkey.pem \
            -out    test-certs/live/$DOMAIN/fullchain.pem
          docker run --rm -v "$PWD/test-certs:/etc/letsencrypt:ro" intranet-proxy:test nginx -t

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
